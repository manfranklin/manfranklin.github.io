name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
          SITE_NAME: ${{ vars.SITE_NAME || 'Manuel Franklin' }}
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR || 'Manuel Franklin' }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION || 'Business Transformation - Digital Innovation & AI' }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL }}
          SITE_LINKEDIN: ${{ vars.SITE_LINKEDIN }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASEURL: ${{ vars.SITE_BASEURL || '' }}
          SITE_ENFORCE_SSL: ${{ vars.SITE_ENFORCE_SSL  }}
          GOOGLE_ANALYTICS: ${{ vars.GOOGLE_ANALYTICS || '' }}
          GOOGLE_ANALYTICS_GA4: ${{ vars.GOOGLE_ANALYTICS_GA4 || '' }}
          TINA_BRANCH: ${{ vars.TINA_BRANCH || github.ref_name }}
          TINA_CLIENT_ID: ${{ vars.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          UMAMI_ID: ${{ vars.UMAMI_ID || vars.UMAMI_CLIENT_ID || '' }}
          UMAMI_DOMAIN: ${{ vars.UMAMI_DOMAIN || 'cloud.umami.is' }}
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

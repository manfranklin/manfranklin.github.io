      intro_1: "Olá. O que te traz até aqui?"
      intro_2: "Provavelmente estás a perguntar quem sou. É uma das perguntas mais antigas da filosofia e, ao que parece, continua sem uma resposta definitiva. Portanto, vou limitar-me às partes que cabem num perfil."
      tldr_label: "Resumo"
      tldr_text: "Sou um generalista com interesses multidisciplinares. Gosto de explorar diferentes áreas, ligar ideias entre disciplinas e transformar conhecimento diversificado em soluções práticas. "
      longer_heading: "A versão mais longa"
      longer_1: "O meu nome já está visível. Onde trabalho e vivo importa menos do que aquilo que faço e aquilo que me desperta curiosidade. O resto é, em grande parte, papelada: uma licenciatura em Engenharia Electrotécnica e um mestrado em Transformação Digital."
      longer_2: "Profissionalmente, gosto de desenvolver software, modernizar sistemas, melhorar processos e transformar desafios complexos em soluções mais simples, fiáveis e fáceis de manter."
      longer_3: "Valorizo a evidência mais do que as suposições, a clareza mais do que a complexidade desnecessária e a entrega de resultados significativos mais do que refinar indefinidamente ideias que nunca saem do papel."
      interests_heading: "Áreas de Interesse"
      interests_items:
        - "IA Conversacional"
        - "Sistemas Embebidos e Ciberfísicos"
        - "Rádio Definido por Software"
        - "Cibersegurança"
        - "Estratégia e Transformação Digital"
        - "Melhoria de Processos de Negócio"
        - "Aprendizagem Organizacional"
        - "Capital de Risco"
      connect_text: "Tens um desafio, projeto ou ideia interessante? Não hesites em entrar em contacto."
      email_label: "Email"
      email_value: "manfranklin817 [arroba] gmail [ponto] com"
    disclaimer:
      heading: "Aviso"
      intro_1: "Não é assumida qualquer responsabilidade por danos resultantes da utilização deste website, de quaisquer recursos descarregáveis ou de serviços de terceiros incorporados no mesmo."
      intro_2: "Este website não armazena dados pessoais para o seu funcionamento principal, não utiliza cookies de rastreio e está em conformidade com o GDPR."
      intro_3: "Por enquanto os comentários estão desativados neste website."
      intro_4: "O website utiliza a ferramenta Umami Analytcs para a análise anónima do tráfego web, com o objetivo de compreender padrões gerais de utilização. O Umami não identifica indivíduos nem depende de rastreio com fins publicitários."

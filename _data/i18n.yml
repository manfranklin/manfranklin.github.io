  pages:
    about:
      heading: "About Me"
      intro_1: "Hello. What brings you here?"
      intro_2: "You're probably wondering who am I. That's a surprisingly difficult question. Philosophers have been working on it for a while, and the answer is far from trivial. So, I'll stick to the parts that fit on a profile."
      tldr_label: "TL;DR"
      tldr_text: "I’m a generalist — a Jack of all trades, master of none. I enjoy learning across disciplines, connecting ideas, and turning diverse knowledge into practical solutions."
      longer_heading: "The longer version"
      longer_1: "My name is already visible. Where I work and live matters less than what I do and what I am curious about. The rest is mostly paperwork: a degree in Electrical Engineering and a Master's in Digital Transformation."
      longer_2: "Professionally, I enjoy building software, modernizing systems, improving processes, and turning complex challenges into solutions that are simpler, more reliable, and easier to maintain."
      longer_3: "I value evidence over assumptions, clarity over unnecessary complexity, and delivering meaningful results over endlessly refining ideas that never leave the drawing board."
      interests_heading: "Areas of Interest"
      interests_items:
        - "Conversational AI"
        - "Embedded and Cyber-Physical Systems"
        - "Software-Defined Radio"
        - "Cybersecurity"
        - "Digital Strategy & Transformation"
        - "Business Process Improvement"
        - "Organizational Learning"
        - "Venture Capital"
      connect_text: "Have an interesting problem, project, or idea? Feel free to reach out."
      email_label: "Email"
      email_value: "manfranklin817 [at] gmail [dot] com"
    disclaimer:
      heading: "Disclaimer"
      intro_1: "No liability is assumed for damages arising from the use of this website, any downloadable resources, or third-party services embedded on it."
      intro_2: "This website does not store personal data for its core functionality, uses no tracking cookies, and is GDPR compliant."
      intro_3: "Comments are disabled on this site."
      intro_4: "The site uses Umami for anonymous web analytics to understand general usage patterns. Umami does not identify individuals and does not rely on advertising-style tracking."
      questions_heading: "For questions and suggestions:"
      email_label: "Email"
      email_value: "manfranklin817 [at] gmail [dot] com"
      responsible_heading: "Responsible for this website:"
      responsible_name: "Manuel Franklin"


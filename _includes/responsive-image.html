<img src="{{ url | default: original.path | relative_url }}"
     srcset="{% for resized in resized %}{{ resized.path | relative_url }} {{ resized.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
     sizes="{{ sizes | join: ', ' }}"
     alt="{{ alt }}"
     class="{{ class | default: '' }}"
     loading="{{ loading | default: 'lazy' }}"
     data-caption="{{ alt }}">
